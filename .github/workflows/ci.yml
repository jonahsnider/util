name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - parallel:
          - run: vp check
          - run: vp test --run --coverage
          - run: vp exec knip
          - run: vp pack
      - run: vp exec api-extractor run
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
